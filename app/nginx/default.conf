# Server block for the portfolio SPA. Runs inside nginx-unprivileged:
# non-root, port 8080, temp files under /tmp (an emptyDir in Kubernetes,
# so the container root filesystem can stay read-only).

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness / readiness endpoint for Kubernetes probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Raw connection stats, scraped by the nginx-prometheus-exporter sidecar
    # over localhost only. Never reachable through the Service or Ingress.
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to index.html,
    # which must never be cached so new releases show up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
