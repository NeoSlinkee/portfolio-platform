# Validates the optional Azure (AKS) stack on every change. It never runs
# `terraform apply` and needs no Azure account or credentials, so it is free.

name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform/aks

jobs:
  validate:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: tflint (with azurerm ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

      - name: checkov
        run: |
          pip install --quiet checkov==3.3.20
          checkov --compact --quiet --skip-download -d . --framework terraform
