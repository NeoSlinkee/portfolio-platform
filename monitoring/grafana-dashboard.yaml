apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  portfolio.json: |
    {
      "title": "Portfolio (nginx on Kubernetes)",
      "uid": "portfolio",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "portfolio"
      ],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Healthy nginx pods",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(nginx_up{namespace=\"portfolio\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / s",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(nginx_http_requests_total{namespace=\"portfolio\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Active connections",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(nginx_connections_active{namespace=\"portfolio\"})"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts (1h)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"portfolio\"}[1h]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests per second by pod",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(nginx_http_requests_total{namespace=\"portfolio\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Active connections by pod",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (nginx_connections_active{namespace=\"portfolio\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU usage (cores)",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"portfolio\",container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory working set",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"portfolio\",container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
