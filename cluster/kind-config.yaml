# Local Kubernetes cluster (runs in Docker, free). 1 control plane + 2 workers
# so topology spread, PodDisruptionBudgets and node drains behave realistically.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: portfolio
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Expose the ingress controller on localhost:8080 / 8443.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
