# Zero-trust by default: deny all traffic, then allow only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-allow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  policyTypes: ["Ingress"]
  ingress:
    # Web traffic only from the ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    # Metrics only from Prometheus.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9113
  # No egress rule: a static site has no reason to call out. The exporter
  # reaches nginx over localhost, which NetworkPolicy does not filter.
